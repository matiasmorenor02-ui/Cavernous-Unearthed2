name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --console=plain 2>&1 | tee errores.txt
          exit ${PIPESTATUS[0]}

      - name: Subir log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: errores
          path: errores.txt

      - name: Subir jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
